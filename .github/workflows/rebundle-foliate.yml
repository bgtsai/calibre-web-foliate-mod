name: Rebundle Foliate JS

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Pack foliate-src/bundle.js back into BUNDLE_SOURCE
        run: python3 tools/pack.py bundle

      - name: Commit updated script
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add calibre-web-foliate-mod.user.js
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "rebundle: pack foliate-src/bundle.js back into BUNDLE_SOURCE"
          git push
