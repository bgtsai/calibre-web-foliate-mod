name: Unbundle Foliate JS

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unbundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Extract BUNDLE_SOURCE to foliate-src/bundle.js
        run: python3 tools/unpack.py bundle

      - name: Commit foliate-src/bundle.js
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add foliate-src/bundle.js
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "unbundle: extract BUNDLE_SOURCE to foliate-src/bundle.js"
          git push
